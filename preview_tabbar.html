<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#ddd; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width:375px; height:760px; margin:20px auto; background:#F5F0FF; position:relative; overflow:hidden; border-radius:24px; }
img { display:block; }
/* 模拟页面底部内容，检验谷区透出效果 */
.fake { position:absolute; left:20px; right:20px; top:560px; height:120px; background:#fff; border-radius:14px; padding:12px; color:#2A2440; font-size:14px; }
@charset "UTF-8";
/* ==================== 设计令牌 ==================== */
.unida-tabbar {
  --purple: #805CFA;
  --purple-deep: #6941E8;
  --text-main: #41365E;
  --text-muted: #88809F;
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(78px + env(safe-area-inset-bottom));
  height: calc(78px + constant(safe-area-inset-bottom));
  z-index: 9999;
  box-sizing: border-box;
  padding-bottom: env(safe-area-inset-bottom);
  padding-bottom: constant(safe-area-inset-bottom);
}

/* ==================== 下沉式波浪底座 ==================== */
/* wave-tab-v2：左右波峰托图标，中间谷底下沉让位发布球；谷底曲线最低 104px */
.wave-bg {
  position: absolute;
  left: 0;
  top: 7px;
  width: 100%;
  height: 150px;
  z-index: 1;
}

/* 波浪图下方的实心白底：从谷底最低点(约104px)之下接缝，保证谷区透明不被填白 */
.wave-solid {
  position: absolute;
  left: 0;
  right: 0;
  top: 106px;
  bottom: 0;
  background: #FFFFFF;
  z-index: 0;
}

/* ==================== 导航布局 ==================== */
.tabbar-content {
  position: absolute;
  left: 0;
  right: 0;
  top: 22px;
  height: 70px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: start;
  z-index: 5;
}

.tab-item {
  height: 62.5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  position: relative;
  padding-top: 5px;
  box-sizing: border-box;
}

.publish-space {
  pointer-events: none;
}

/* ==================== 3D 立体图标 ==================== */
.icon-wrap {
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.25s ease;
}

.tab-ico {
  width: 33px;
  height: 33px;
  opacity: 0.45;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

/* 选中：图标弹起 + 底部紫色光晕 */
.tab-item.active .tab-ico {
  opacity: 1;
  transform: translateY(-3px);
}

.tab-item.active .icon-wrap::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -4px;
  transform: translateX(-50%);
  width: 42px;
  height: 12px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(128, 92, 250, 0.3) 0%, rgba(128, 92, 250, 0) 72%);
}

/* 消息角标 */
.message-wrap {
  position: relative;
}

.message-badge {
  position: absolute;
  top: -3px;
  right: -5px;
  min-width: 15px;
  height: 15px;
  padding: 0 3.5px;
  border-radius: 15px;
  background: linear-gradient(135deg, #FF9B45, #FF702E);
  color: #FFFFFF;
  font-size: 9.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid #FFFFFF;
  box-shadow: 0 2px 5px rgba(255, 112, 46, 0.25);
  z-index: 2;
}

/* ==================== 文字 ==================== */
.tab-text {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 500;
  line-height: 17px;
}

.active .tab-text {
  color: #6C3FF2;
  font-weight: 700;
}

/* 激活指示线 */
.active-line {
  width: 21px;
  height: 4.5px;
  margin-top: 2px;
  border-radius: 10px;
  background: linear-gradient(90deg, #B69AFF, #805CFA);
  box-shadow: 0 1.5px 5px rgba(128, 92, 250, 0.25);
}

/* ==================== 中央 U 星球发布键 ==================== */
.publish-center {
  position: absolute;
  left: 50%;
  top: 8px;
  transform: translateX(-50%);
  width: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 20;
}

/* 呼吸光晕（径向渐变，不用 filter，性能友好） */
.publish-glow {
  position: absolute;
  top: -3px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(154, 120, 255, 0.3) 0%, rgba(154, 120, 255, 0.12) 46%, rgba(154, 120, 255, 0) 70%);
  animation: glowPulse 3.2s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% {
    opacity: 0.75;
    transform: translateX(-50%) scale(1);
  }
  50% {
    opacity: 1;
    transform: translateX(-50%) scale(1.06);
  }
}
/* U 星球 logo：立体星球 + 光环 + 星芒，本身就是发布按钮主体 */
.publish-logo {
  position: relative;
  width: 56px;
  height: 56px;
  z-index: 2;
}

.publish-text {
  margin-top: 0px;
  font-size: 11.5px;
  color: #6C3FF2;
  font-weight: 700;
  z-index: 2;
}

/* ==================== 点击反馈 ==================== */
.tab-item:active .tab-ico {
  transform: scale(0.92);
}

.publish-center:active .publish-logo {
  transform: scale(0.92);
}

</style></head><body>
<div class="phone">
  <div class="fake">模拟页面卡片内容——检查它透过波浪谷区是否可辨、发布文字是否可读</div>
  <view class="unida-tabbar" style="width:375px">
    <view class="wave-solid"></view>
    <img class="wave-bg" src="static/art/wave-tab-v2.png" style="object-fit:fill">
    <view class="tabbar-content">
      <view class="tab-item active" style="pointer-events:none">
        <view class="icon-wrap"><img class="tab-ico" src="static/unida/tabbar/tab-home.png" style="object-fit:contain"></view>
        <text class="tab-text">首页</text><view class="active-line"></view>
      </view>
      <view class="tab-item" style="pointer-events:none">
        <view class="icon-wrap"><img class="tab-ico" src="static/unida/tabbar/tab-discover.png" style="object-fit:contain"></view>
        <text class="tab-text">发现</text>
      </view>
      <view class="tab-item publish-space"></view>
      <view class="tab-item" style="pointer-events:none">
        <view class="icon-wrap message-wrap"><img class="tab-ico" src="static/unida/tabbar/tab-message.png" style="object-fit:contain"><view class="message-badge">3</view></view>
        <text class="tab-text">消息</text>
      </view>
      <view class="tab-item" style="pointer-events:none">
        <view class="icon-wrap"><img class="tab-ico" src="static/unida/tabbar/tab-mine.png" style="object-fit:contain"></view>
        <text class="tab-text">我的</text>
      </view>
    </view>
    <view class="publish-center" style="pointer-events:none">
      <view class="publish-glow"></view>
      <img class="publish-logo" src="static/unida/tabbar/publish-logo.png" style="object-fit:contain">
      <text class="publish-text">发布</text>
    </view>
  </view>
</div>
</body></html>
