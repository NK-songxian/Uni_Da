<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#ddd; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width:375px; height:812px; margin:0 auto; background:#F5F0FF; position:relative; overflow:hidden; }
img { display:block; }
span { display:inline; }
@charset "UTF-8";
.ad {
  padding-bottom: 90px;
}

/* ══════════ 封面 ══════════ */
.ad__cover {
  position: relative;
  height: 360px;
  overflow: hidden;
}

.ad__cover-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.ad__cover-shade {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 130px;
  background: linear-gradient(180deg, rgba(57, 0, 126, 0) 0%, rgba(57, 0, 126, 0.28) 100%);
}

/* 透明浮层导航：白字 + 深描边，无框无投影 */
.ad__nav {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 16px;
  padding-right: 16px;
  padding-bottom: 8px;
}

.ad__nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ad__nav-ico {
  width: 20px;
  height: 20px;
  filter: brightness(0) invert(1);
}

.ad__nav-title {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 5px rgba(57, 0, 126, 0.55);
  letter-spacing: 0.25px;
}

.ad__cover-status {
  position: absolute;
  left: 16px;
  bottom: 50px;
  display: flex;
  align-items: center;
  flex-direction: row;
  padding: 6px 13px;
  border-radius: 499.5px;
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.94) 0%, rgba(247, 242, 255, 0.88) 100%);
  box-shadow: 0 7px 18px rgba(123, 97, 255, 0.22);
}

.ad__cover-status-ico {
  width: 14px;
  height: 14px;
  margin-right: 5px;
}

.ad__cover-status-t {
  font-size: 12px;
  font-weight: 700;
  color: #39007E;
  letter-spacing: 0.25px;
}

/* ══════════ 主体信息卡（叠压封面） ══════════ */
.ad__main {
  position: relative;
  z-index: 5;
  margin: -38px 16px 0;
  padding: 16px 14px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 4px 12px rgba(123, 97, 255, 0.08);
}

.ad__title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.ad__title {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  color: #39007E;
  line-height: 1.42;
  letter-spacing: -0.4px;
}

.ad__fav {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 6px;
}

.ad__fav-ico {
  width: 22px;
  height: 22px;
  opacity: 0.45;
  transition: opacity 0.2s ease;
}

.ad__fav-ico--on {
  opacity: 1;
}

.ad__tags {
  display: flex;
  flex-wrap: wrap;
  margin-top: 10px;
}

.ad__tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.15px;
  padding: 4px 9px;
  border-radius: 499.5px;
  margin-right: 6px;
  margin-bottom: 4px;
}

.ad__tag--purple {
  color: #805CFA;
  background: rgba(128, 92, 250, 0.1);
}

.ad__tag--orange {
  color: #FF9B77;
  background: rgba(255, 155, 119, 0.14);
}

.ad__tag--green {
  color: #29CA83;
  background: rgba(41, 202, 131, 0.13);
}

.ad__meta {
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid #EFEAF7;
}

.ad__meta-item {
  display: flex;
  align-items: center;
  margin-bottom: 11px;
}

.ad__meta-item:last-child {
  margin-bottom: 0;
}

.ad__meta-ico {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  flex-shrink: 0;
  background: linear-gradient(150deg, rgba(169, 139, 255, 0.16), rgba(128, 92, 250, 0.08));
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
}

.ad__meta-ico img {
  width: 17px;
  height: 17px;
}

.ad__meta-col {
  display: flex;
  flex-direction: column;
}

.ad__meta-label {
  font-size: 11px;
  color: #8A83A0;
  letter-spacing: 0.15px;
}

.ad__meta-value {
  margin-top: 3px;
  font-size: 14px;
  font-weight: 600;
  color: #39007E;
  letter-spacing: -0.1px;
}

/* 报名进度 */
.ad__progress {
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid #EFEAF7;
}

.ad__progress-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.ad__progress-t {
  font-size: 12px;
  color: #8A83A0;
  letter-spacing: 0.15px;
}

.ad__progress-n {
  font-family: "DIN Alternate", "Poppins", -apple-system, sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #805CFA;
}

.ad__progress-slash {
  font-size: 11px;
  color: #B8B2C8;
}

.ad__progress-track {
  margin-top: 8px;
  height: 6px;
  border-radius: 499.5px;
  background: #EFEAF7;
  overflow: hidden;
}

.ad__progress-fill {
  height: 100%;
  border-radius: 499.5px;
  background: linear-gradient(90deg, #A98BFF, #805CFA);
  transition: width 0.4s cubic-bezier(0.22, 0.9, 0.3, 1);
}

/* ══════════ 通用卡片区块 ══════════ */
.ad__card {
  margin: 12px 16px 0;
  padding: 14px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 4px 12px rgba(123, 97, 255, 0.08);
}

.ad__subhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 11px;
}

.ad__subhead-title {
  font-size: 16px;
  font-weight: 700;
  color: #39007E;
  letter-spacing: -0.15px;
}

.ad__subhead-more {
  font-size: 12px;
  color: #8A83A0;
}

/* 发起人 */
.ad__organizer {
  display: flex;
  align-items: center;
}

.ad__org-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  flex-shrink: 0;
  background: linear-gradient(145deg, #A98BFF, #6C3FF2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  box-shadow: 0 4px 10px rgba(108, 63, 242, 0.28);
  margin-right: 10px;
}

.ad__org-info {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.ad__org-name-row {
  display: flex;
  align-items: center;
}

.ad__org-name {
  font-size: 16px;
  font-weight: 700;
  color: #39007E;
  letter-spacing: -0.15px;
}

.ad__org-verified {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  margin-left: 5px;
  background: #29CA83;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ad__org-verified img {
  width: 10px;
  height: 10px;
  filter: brightness(0) invert(1);
}

.ad__org-sub {
  margin-top: 4px;
  font-size: 12px;
  color: #8A83A0;
  letter-spacing: 0.1px;
}

.ad__org-arrow {
  width: 16px;
  height: 16px;
  opacity: 0.4;
}

/* 报名人员 */
.ad__avatars {
  display: flex;
  align-items: center;
}

.ad__avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  border: 2px solid #fff;
  margin-right: -8px;
}

.ad__avatar-more {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "DIN Alternate", "Poppins", -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: #805CFA;
  background: rgba(128, 92, 250, 0.1);
  border: 2px solid #fff;
  margin-left: 10px;
}

.ad__avatars-tip {
  margin-left: auto;
  font-size: 11px;
  color: #B8B2C8;
}

/* 详情 / 费用 */
.ad__desc-text {
  display: block;
  font-size: 14px;
  color: #2A2440;
  line-height: 1.78;
  margin-bottom: 7px;
  letter-spacing: 0.1px;
}

.ad__desc-text:last-child {
  margin-bottom: 0;
}

.ad__cost {
  display: flex;
  align-items: center;
}

.ad__cost-free {
  font-size: 14px;
  font-weight: 700;
  color: #29CA83;
}

.ad__cost-dot {
  margin: 0 6px;
  color: #B8B2C8;
}

.ad__cost-text {
  font-size: 14px;
  color: #2A2440;
}

/* ══════════ 底部报名栏 ══════════ */
.ad__bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  padding: 9px 16px;
  padding-bottom: calc(9px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 -3px 12px rgba(123, 97, 255, 0.08);
}

.ad__bottom-left {
  width: 55px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.ad__bottom-ico {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(128, 92, 250, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
}

.ad__bottom-ico img {
  width: 18px;
  height: 18px;
}

.ad__bottom-label {
  margin-top: 3px;
  font-size: 11px;
  color: #8A83A0;
}

.ad__bottom-btn {
  flex: 1;
  height: 46px;
  border-radius: 499.5px;
  background: linear-gradient(145deg, #A98BFF 0%, #8964FC 55%, #754AF0 100%);
  box-shadow: 0 7px 18px rgba(123, 97, 255, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
}

.ad__bottom-btn:active {
  opacity: 0.9;
}

</style></head><body>
<div class="phone">
<div class="ad unida-page">
  <div class="ad__cover">
    <img class="ad__cover-img" src="static/art/art-guitar.jpg">
    <div class="ad__cover-shade"></div>
    <div class="ad__nav" style="padding-top:20px">
      <div class="ad__nav-btn"><img class="ad__nav-ico" src="static/icons-dark/back.png"></div>
      <span class="ad__nav-title">活动详情</span>
      <div class="ad__nav-btn"><img class="ad__nav-ico" src="static/icons-dark/bell.png"></div>
    </div>
    <div class="ad__cover-status">
      <img class="ad__cover-status-ico" src="static/icons-dark/flame.png">
      <span class="ad__cover-status-t">报名中</span>
    </div>
  </div>

  <div class="ad__main">
    <div class="ad__title-row">
      <span class="ad__title">校园草地音乐会 · 一起嗨翻周末</span>
      <div class="ad__fav"><img class="ad__fav-ico" src="static/icons-dark/heart.png"></div>
    </div>
    <div class="ad__tags">
      <span class="ad__tag ad__tag--purple">校园活动</span>
      <span class="ad__tag ad__tag--orange">热门</span>
      <span class="ad__tag ad__tag--green">免费</span>
    </div>
    <div class="ad__meta">
      <div class="ad__meta-item">
        <div class="ad__meta-ico"><img src="static/icons-dark/clock.png"></div>
        <div class="ad__meta-col"><span class="ad__meta-label">活动时间</span><span class="ad__meta-value">本周六 19:00 - 21:00</span></div>
      </div>
      <div class="ad__meta-item">
        <div class="ad__meta-ico"><img src="static/icons-dark/pin.png"></div>
        <div class="ad__meta-col"><span class="ad__meta-label">活动地点</span><span class="ad__meta-value">中心草坪广场</span></div>
      </div>
    </div>
    <div class="ad__progress">
      <div class="ad__progress-head"><span class="ad__progress-t">报名进度</span><span class="ad__progress-n">36 / 50 人</span></div>
      <div class="ad__progress-track"><div class="ad__progress-fill" style="width:72%"></div></div>
    </div>
  </div>

  <div class="ad__card ad__organizer">
    <div class="ad__org-avatar">林</div>
    <div class="ad__org-info">
      <div class="ad__org-name-row"><span class="ad__org-name">音乐社 · 小林</span><div class="ad__org-verified"><img src="static/icons-dark/buddy.png"></div></div>
      <span class="ad__org-sub">已认证 · 4.9 分</span>
    </div>
    <img class="ad__org-arrow" src="static/icons-dark/chevron.png">
  </div>

  <div class="ad__card">
    <div class="ad__subhead"><span class="ad__subhead-title">报名人员</span><span class="ad__subhead-more">查看全部 ›</span></div>
    <div class="ad__avatars">
      <div class="ad__avatar" style="background:linear-gradient(135deg,#A98BFF,#805CFA)">陈</div>
      <div class="ad__avatar" style="background:linear-gradient(135deg,#FFC94F,#FF9B77)">李</div>
      <div class="ad__avatar" style="background:linear-gradient(135deg,#29CA83,#93EDCF)">王</div>
      <div class="ad__avatar" style="background:linear-gradient(135deg,#69B9F5,#A98BFF)">周</div>
      <div class="ad__avatar" style="background:linear-gradient(135deg,#805CFA,#542DAF)">吴</div>
      <div class="ad__avatar-more">+14</div>
      <span class="ad__avatars-tip">已有 36 人加入</span>
    </div>
  </div>

  <div class="ad__card">
    <div class="ad__subhead"><span class="ad__subhead-title">活动详情</span></div>
    <span class="ad__desc-text">一起在草地上听歌、唱歌、认识新朋友！我们准备了音响、吉他和零食，欢迎会乐器或爱唱歌的同学加入，也欢迎来当观众。</span>
    <span class="ad__desc-text">请自带野餐垫，注意防蚊。活动结束后一起收拾场地哦～</span>
  </div>

  <div class="ad__card">
    <div class="ad__subhead"><span class="ad__subhead-title">费用说明</span></div>
    <div class="ad__cost"><span class="ad__cost-free">免费参与</span><span class="ad__cost-dot">·</span><span class="ad__cost-text">零食饮料 AA（预计 ¥15/人）</span></div>
  </div>

  <div class="ad__bottom">
    <div class="ad__bottom-left">
      <div class="ad__bottom-ico"><img src="static/icons-dark/message.png"></div>
      <span class="ad__bottom-label">联系</span>
    </div>
    <div class="ad__bottom-btn">立即报名</div>
  </div>
</div>
</div>
</body></html>
