<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#ddd; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width:375px; height:812px; margin:0 auto; background:#F5F0FF; position:relative; overflow:hidden; }
img { display:block; }
span { display:inline; }
textarea { border:none; outline:none; font-family:inherit; resize:none; }
@charset "UTF-8";
.bc {
  padding-bottom: calc(110px + env(safe-area-inset-bottom));
}

/* ══════════ 顶栏 ══════════ */
.bc__nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 16px;
  padding-right: 16px;
  padding-bottom: 8px;
  background: #F5F0FF;
}

.bc__nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bc__nav-ico {
  width: 20px;
  height: 20px;
}

.bc__nav-title {
  font-size: 16px;
  font-weight: 700;
  color: #39007E;
  letter-spacing: 0.25px;
}

/* ══════════ 活动卡 ══════════ */
.bc__act {
  display: flex;
  margin: 4px 16px 0;
  padding: 10px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 4px 12px rgba(123, 97, 255, 0.08);
}

.bc__act-cover {
  width: 90px;
  height: 90px;
  border-radius: 14px;
  flex-shrink: 0;
  background: #E9D5FE;
}

.bc__act-body {
  flex: 1;
  margin-left: 11px;
  display: flex;
  flex-direction: column;
}

.bc__act-title {
  font-size: 16px;
  font-weight: 700;
  color: #39007E;
  line-height: 1.42;
  letter-spacing: -0.25px;
}

.bc__act-meta {
  display: flex;
  align-items: center;
  margin-top: 6px;
}

.bc__act-ico {
  width: 13px;
  height: 13px;
  opacity: 0.5;
  flex-shrink: 0;
}

.bc__act-t {
  margin-left: 5px;
  font-size: 12px;
  color: #8A83A0;
  letter-spacing: 0.1px;
}

/* ══════════ 通用卡片 ══════════ */
.bc__card {
  margin: 12px 16px 0;
  padding: 14px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 4px 12px rgba(123, 97, 255, 0.08);
}

.bc__sec-title {
  font-size: 16px;
  font-weight: 700;
  color: #39007E;
  letter-spacing: -0.15px;
}

.bc__opt {
  font-size: 12px;
  font-weight: 400;
  color: #B8B2C8;
}

/* 信息行 */
.bc__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 0;
  border-bottom: 1px solid #EFEAF7;
}

.bc__row:first-of-type {
  margin-top: 4px;
}

.bc__row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.bc__row-k {
  font-size: 14px;
  color: #8A83A0;
  letter-spacing: 0.1px;
}

.bc__row-v {
  font-size: 14px;
  font-weight: 600;
  color: #39007E;
  letter-spacing: -0.1px;
}

/* 人数步进器 */
.bc__stepper {
  display: flex;
  align-items: center;
}

.bc__step {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(128, 92, 250, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
}

.bc__step--off {
  opacity: 0.32;
}

.bc__step-bar {
  width: 11px;
  height: 2px;
  border-radius: 2px;
  background: #805CFA;
}

.bc__step-plus {
  width: 12px;
  height: 12px;
}

.bc__step-num {
  min-width: 32px;
  text-align: center;
  font-family: "DIN Alternate", "Poppins", -apple-system, sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: #39007E;
}

/* 备注 */
.bc__ta {
  display: block;
  width: 100%;
  height: 84px;
  margin-top: 10px;
  padding: 10px;
  border-radius: 14px;
  box-sizing: border-box;
  background: #F5F0FF;
  font-size: 14px;
  color: #2A2440;
  line-height: 1.6;
}

.bc__ta-ph {
  color: #B8B2C8;
  font-size: 14px;
}

.bc__count {
  display: block;
  text-align: right;
  margin-top: 5px;
  font-family: "DIN Alternate", "Poppins", -apple-system, sans-serif;
  font-size: 11px;
  color: #B8B2C8;
}

/* ══════════ 提示 ══════════ */
.bc__notice {
  display: flex;
  align-items: flex-start;
  margin: 12px 16px 0;
  padding: 11px 12px;
  border-radius: 14px;
  background: rgba(255, 201, 79, 0.14);
}

.bc__notice-ico {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}

.bc__notice-t {
  flex: 1;
  margin-left: 7px;
  font-size: 12px;
  color: #8A6A18;
  line-height: 1.62;
  letter-spacing: 0.1px;
}

/* ══════════ 底部 ══════════ */
.bc__bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  padding: 9px 16px;
  padding-bottom: calc(9px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 -3px 12px rgba(123, 97, 255, 0.08);
}

.bc__agree {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}

.bc__cb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid #C9C2DD;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.bc__cb--on {
  background: #805CFA;
  border-color: #805CFA;
}

/* 对勾用两条旋转边框画，不用字符 */
.bc__cb-tick {
  width: 9px;
  height: 5px;
  margin-top: -2px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg);
}

.bc__agree-t {
  margin-left: 5px;
  font-size: 11px;
  color: #8A83A0;
  letter-spacing: 0.1px;
}

.bc__submit {
  height: 46px;
  border-radius: 499.5px;
  background: linear-gradient(145deg, #A98BFF 0%, #8964FC 55%, #754AF0 100%);
  box-shadow: 0 7px 18px rgba(123, 97, 255, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s ease;
}

.bc__submit--off {
  opacity: 0.5;
  box-shadow: none;
}

.bc__submit-t {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
}

</style></head><body><div class="phone">
<div class="bc unida-page">
  <div class="bc__nav" style="padding-top:20px">
    <div class="bc__nav-btn"><img class="bc__nav-ico" src="static/icons-dark/back.png"></div>
    <span class="bc__nav-title">报名确认</span>
    <div class="bc__nav-btn"></div>
  </div>
  <div class="bc__act">
    <img class="bc__act-cover" src="static/art/art-guitar.jpg">
    <div class="bc__act-body">
      <span class="bc__act-title">校园草地音乐会 · 一起嗨翻周末</span>
      <div class="bc__act-meta"><img class="bc__act-ico" src="static/icons-dark/clock.png"><span class="bc__act-t">本周六 19:00 - 21:00</span></div>
      <div class="bc__act-meta"><img class="bc__act-ico" src="static/icons-dark/pin.png"><span class="bc__act-t">中心草坪广场</span></div>
    </div>
  </div>
  <div class="bc__card">
    <div class="bc__sec-title">预约信息</div>
    <div class="bc__row"><span class="bc__row-k">预约时间</span><span class="bc__row-v">本周六 19:00</span></div>
    <div class="bc__row">
      <span class="bc__row-k">参与人数</span>
      <div class="bc__stepper">
        <div class="bc__step"><div class="bc__step-bar"></div></div>
        <span class="bc__step-num">1</span>
        <div class="bc__step"><img class="bc__step-plus" src="static/icons-dark/plus.png"></div>
      </div>
    </div>
    <div class="bc__row"><span class="bc__row-k">联系电话</span><span class="bc__row-v">138****8888</span></div>
  </div>
  <div class="bc__card">
    <div class="bc__sec-title">参与备注<span class="bc__opt">（选填）</span></div>
    <textarea class="bc__ta" placeholder="想对发起人说什么？例如：我会弹吉他～"></textarea>
    <span class="bc__count">0/100</span>
  </div>
  <div class="bc__notice">
    <img class="bc__notice-ico" src="static/icons-dark/bulb.png">
    <span class="bc__notice-t">本活动免费，现场零食饮料 AA 自愿参与。请准时到场，如需取消请提前 2 小时操作。</span>
  </div>
  <div class="bc__bottom">
    <div class="bc__agree">
      <div class="bc__cb bc__cb--on"><div class="bc__cb-tick"></div></div>
      <span class="bc__agree-t">我已阅读并同意活动参与须知</span>
    </div>
    <div class="bc__submit"><span class="bc__submit-t">提交报名</span></div>
  </div>
</div>
</div></body></html>
