<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#ddd; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width:375px; height:812px; margin:0 auto; background:#F5F0FF; position:relative; overflow:hidden; }
img { display:block; }
span { display:inline; }
textarea { border:none; outline:none; font-family:inherit; resize:none; }
@charset "UTF-8";
.bs {
  min-height: 100vh;
  padding-bottom: calc(30px + env(safe-area-inset-bottom));
}

/* ══════════ 成功区 ══════════ */
.bs__hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 28px;
  background: linear-gradient(180deg, #EDE4FF 0%, #F5F0FF 100%);
  border-radius: 0 0 28px 28px;
}

.bs__planet {
  width: 130px;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: floaty 3.6s ease-in-out infinite;
}

.bs__planet-img {
  width: 120px;
  height: 116px;
}

@keyframes floaty {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-7px);
  }
}
/* 星光：仅透明度/缩放，零重排 */
.bs__sp {
  position: absolute;
}

.bs__sp--1 {
  width: 22px;
  height: 22px;
  left: 66px;
  top: 84px;
  animation: twinkle 2.4s ease-in-out infinite;
}

.bs__sp--2 {
  width: 17px;
  height: 17px;
  right: 64px;
  top: 107px;
  animation: twinkle 2.8s ease-in-out 0.4s infinite;
}

.bs__sp--3 {
  width: 13px;
  height: 13px;
  right: 84px;
  top: 75px;
  animation: twinkle 3.2s ease-in-out 0.8s infinite;
}

@keyframes twinkle {
  0%, 100% {
    opacity: 0.45;
    transform: scale(0.86);
  }
  50% {
    opacity: 1;
    transform: scale(1.06);
  }
}
.bs__title {
  margin-top: 4px;
  font-size: 22px;
  font-weight: 700;
  color: #39007E;
  letter-spacing: 0.5px;
}

.bs__sub {
  margin-top: 7px;
  font-size: 12px;
  color: #8A83A0;
  letter-spacing: 0.2px;
}

/* ══════════ 信息卡 ══════════ */
.bs__card {
  margin: 12px 16px 0;
  padding: 14px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 4px 12px rgba(123, 97, 255, 0.08);
}

.bs__card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1px solid #EFEAF7;
}

.bs__card-title {
  font-size: 16px;
  font-weight: 700;
  color: #39007E;
  letter-spacing: -0.15px;
}

.bs__badge {
  display: flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 499.5px;
  background: rgba(41, 202, 131, 0.12);
}

.bs__badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #29CA83;
  margin-right: 4px;
}

.bs__badge-t {
  font-size: 11px;
  font-weight: 600;
  color: #29CA83;
  letter-spacing: 0.15px;
}

.bs__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #EFEAF7;
}

.bs__row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.bs__row-k {
  font-size: 14px;
  color: #8A83A0;
  letter-spacing: 0.1px;
}

.bs__row-v {
  font-size: 14px;
  font-weight: 600;
  color: #39007E;
  letter-spacing: -0.1px;
}

.bs__row-code {
  font-family: "DIN Alternate", "Poppins", -apple-system, sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: #805CFA;
  letter-spacing: 0.5px;
}

/* ══════════ 签到码卡 ══════════ */
.bs__qr-card {
  margin: 12px 16px 0;
  padding: 14px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 4px 12px rgba(123, 97, 255, 0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.bs__qr-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.bs__qr-title-row {
  display: flex;
  align-items: center;
}

.bs__qr-ico {
  width: 16px;
  height: 16px;
}

.bs__qr-title {
  margin-left: 5px;
  font-size: 16px;
  font-weight: 700;
  color: #39007E;
  letter-spacing: -0.15px;
}

.bs__qr-hint {
  font-size: 11px;
  color: #B8B2C8;
}

.bs__qr-box {
  margin-top: 13px;
  padding: 10px;
  border-radius: 14px;
  background: #fff;
  border: 1px solid #EFEAF7;
  box-shadow: 0 3px 9px rgba(123, 97, 255, 0.1);
}

.bs__qr-img {
  width: 150px;
  height: 150px;
}

.bs__qr-tip {
  margin-top: 10px;
  font-size: 12px;
  color: #8A83A0;
  letter-spacing: 0.15px;
}

/* ══════════ 提示 ══════════ */
.bs__notice {
  display: flex;
  align-items: flex-start;
  margin: 12px 16px 0;
  padding: 11px 12px;
  border-radius: 14px;
  background: rgba(128, 92, 250, 0.07);
}

.bs__notice-ico {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 1px;
  opacity: 0.7;
}

.bs__notice-t {
  flex: 1;
  margin-left: 7px;
  font-size: 12px;
  color: #542DAF;
  line-height: 1.62;
  letter-spacing: 0.1px;
}

/* ══════════ 操作按钮 ══════════ */
.bs__actions {
  margin: 18px 16px 0;
}

.bs__btn {
  height: 46px;
  border-radius: 499.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}

.bs__btn--primary {
  background: linear-gradient(145deg, #A98BFF 0%, #8964FC 55%, #754AF0 100%);
  box-shadow: 0 7px 18px rgba(123, 97, 255, 0.22);
}

.bs__btn--ghost {
  background: rgba(128, 92, 250, 0.08);
}

.bs__btn-t {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
}

.bs__btn-t2 {
  font-size: 16px;
  font-weight: 700;
  color: #805CFA;
  letter-spacing: 1px;
}

</style></head><body><div class="phone">
<div class="bs unida-page">
  <div class="bs__hero" style="padding-top:80px">
    <img class="bs__sp bs__sp--1" src="static/unida/illustrations/deco-sparkle-1.png">
    <img class="bs__sp bs__sp--2" src="static/unida/illustrations/deco-sparkle-2.png">
    <img class="bs__sp bs__sp--3" src="static/unida/illustrations/deco-sparkle-1.png">
    <div class="bs__planet"><img class="bs__planet-img" src="static/unida/mascot/u-planet.png"></div>
    <span class="bs__title">报名成功</span>
    <span class="bs__sub">已加入这场校园活动，期待与你相遇</span>
  </div>
  <div class="bs__card">
    <div class="bs__card-head">
      <span class="bs__card-title">报名信息</span>
      <div class="bs__badge"><div class="bs__badge-dot"></div><span class="bs__badge-t">已报名</span></div>
    </div>
    <div class="bs__row"><span class="bs__row-k">活动名称</span><span class="bs__row-v">校园草地音乐会</span></div>
    <div class="bs__row"><span class="bs__row-k">活动时间</span><span class="bs__row-v">本周六 19:00</span></div>
    <div class="bs__row"><span class="bs__row-k">活动地点</span><span class="bs__row-v">中心草坪广场</span></div>
    <div class="bs__row"><span class="bs__row-k">报名编号</span><span class="bs__row-code">UNI 2026 1120 193</span></div>
  </div>
  <div class="bs__qr-card">
    <div class="bs__qr-head">
      <div class="bs__qr-title-row"><img class="bs__qr-ico" src="static/icons-dark/calendar.png"><span class="bs__qr-title">现场签到码</span></div>
      <span class="bs__qr-hint">活动开始前 30 分钟生效</span>
    </div>
    <div class="bs__qr-box"><img class="bs__qr-img" src="static/unida/qr/booking-qr.png"></div>
    <span class="bs__qr-tip">到场后向发起人出示此码完成签到</span>
  </div>
  <div class="bs__notice"><img class="bs__notice-ico" src="static/icons-dark/bell.png"><span class="bs__notice-t">活动开始前会收到提醒。如需取消，请在我的报名中提前操作。</span></div>
  <div class="bs__actions">
    <div class="bs__btn bs__btn--primary"><span class="bs__btn-t">查看我的报名</span></div>
    <div class="bs__btn bs__btn--ghost"><span class="bs__btn-t2">返回首页</span></div>
  </div>
</div>
</div></body></html>
